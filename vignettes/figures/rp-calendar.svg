<text fill="#4a4660" font-size="12" x="485" y="254" text-anchor="middle">no overlap</text>
<rect fill="#ece9f6" stroke="#7a6ad0" stroke-width="1.75" x="560" y="214" width="118" height="46" rx="8"/>
<text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="619" y="243" text-anchor="middle">t&#8722;1</text>
<rect fill="#ffffff" stroke="#3d3580" stroke-width="2" x="694" y="214" width="118" height="46" rx="8"/>
<text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="753" y="243" text-anchor="middle">t</text>
<path stroke="#7a6ad0" stroke-width="2" fill="none" d="M83,260 C83,298 753,298 753,266" marker-end="url(#a3)"/>
<path stroke="#7a6ad0" stroke-width="2" fill="none" d="M217,260 C217,290 753,290 753,266" marker-end="url(#a3)"/>
<path stroke="#7a6ad0" stroke-width="2" fill="none" d="M351,260 C351,284 753,284 753,266" marker-end="url(#a3)"/>
<path stroke="#7a6ad0" stroke-width="2" fill="none" d="M619,260 C619,276 753,276 753,266" marker-end="url(#a3)"/>
<text fill="#4a4660" font-size="12" x="836" y="237">4 carries</text>
<text fill="#4a4660" font-size="12" x="836" y="253">lag 4 as big as lag 1</text>
</g>
<text fill="#4a4660" font-size="12" x="24" y="340">The overlap profile follows from the scheme: <tspan fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace">panel_design(pattern = "2-(2)-2")</tspan> gives lags 1, 3, 4 and 5.</text>

</svg>
