<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 960 452" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,'Inter',Segoe UI,Roboto,sans-serif;">
<title>The cycle of one period</title>
<desc>The period microdata and its recipe, together with the carries retained from earlier periods that share sample with it, go into wave_step, which returns the cross-sectional weights, the level with its standard error, the net change with its standard error, and a new carry. The carry is saved and the next period takes it as an input.</desc>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4660"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6ad0"/></marker></defs>

      <text fill="#8a84a8" font-size="10.5" letter-spacing="1.2" font-family="'JetBrains Mono',ui-monospace,monospace" x="24" y="26">INPUTS</text>
      <text fill="#8a84a8" font-size="10.5" letter-spacing="1.2" font-family="'JetBrains Mono',ui-monospace,monospace" x="368" y="26">THE STEP</text>
      <text fill="#8a84a8" font-size="10.5" letter-spacing="1.2" font-family="'JetBrains Mono',ui-monospace,monospace" x="660" y="26">OUTPUTS</text>

      <rect fill="#ffffff" stroke="#d9dce6" stroke-width="1.5" x="24" y="42" width="232" height="82" rx="10"/>
      <text fill="#20242e" font-size="14.5" font-weight="600" x="42" y="70">Period t microdata</text>
      <text fill="#4a4660" font-size="12" x="42" y="92">plus the weighting recipe</text>
      <text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="42" y="112">weighting_spec(...)</text>

      <rect fill="#ece9f6" stroke="#7a6ad0" stroke-width="1.75" x="24" y="152" width="232" height="104" rx="10"/>
      <text fill="#20242e" font-size="14.5" font-weight="600" x="42" y="180">Carries retained</text>
      <text fill="#4a4660" font-size="12" x="42" y="202">one per lag with a positive</text>
      <text fill="#4a4660" font-size="12" x="42" y="220">sample overlap</text>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="42" y="242">2026-01.rds &#183; 2026-03.rds</text>

      <line stroke="#4a4660" stroke-width="1.6" fill="none" x1="256" y1="83" x2="356" y2="128" marker-end="url(#a1)"/>
      <line stroke="#7a6ad0" stroke-width="2" fill="none" x1="256" y1="204" x2="356" y2="176" marker-end="url(#a2)"/>
      <text fill="#4a4660" font-size="12" x="272" y="78">spec</text>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="262" y="222">previous = list(...)</text>

      <rect fill="#ffffff" stroke="#3d3580" stroke-width="2" x="360" y="118" width="212" height="96" rx="11"/>
      <text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="466" y="158" text-anchor="middle">wave_step()</text>
      <text fill="#4a4660" font-size="12" x="466" y="182" text-anchor="middle">re-runs the whole recipe</text>
      <text fill="#4a4660" font-size="12" x="466" y="200" text-anchor="middle">on every replicate</text>

      <line stroke="#4a4660" stroke-width="1.6" fill="none" x1="572" y1="150" x2="656" y2="76"  marker-end="url(#a1)"/>
      <line stroke="#4a4660" stroke-width="1.6" fill="none" x1="572" y1="160" x2="656" y2="146" marker-end="url(#a1)"/>
      <line stroke="#4a4660" stroke-width="1.6" fill="none" x1="572" y1="176" x2="656" y2="216" marker-end="url(#a1)"/>
      <line stroke="#7a6ad0" stroke-width="2" fill="none" x1="572" y1="192" x2="656" y2="292" marker-end="url(#a2)"/>

      <rect fill="#ffffff" stroke="#d9dce6" stroke-width="1.5" x="660" y="42" width="276" height="62" rx="10"/>
      <text fill="#20242e" font-size="14.5" font-weight="600" x="678" y="68">Cross-sectional weights</text>
      <text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="678" y="90">$weights</text>

      <rect fill="#ffffff" stroke="#d9dce6" stroke-width="1.5" x="660" y="116" width="276" height="62" rx="10"/>
      <text fill="#20242e" font-size="14.5" font-weight="600" x="678" y="142">Level and its standard error</text>
      <text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="678" y="164">$level</text>

      <rect fill="#ffffff" stroke="#d9dce6" stroke-width="1.5" x="660" y="190" width="276" height="62" rx="10"/>
      <text fill="#20242e" font-size="14.5" font-weight="600" x="678" y="216">Net change and its SE</text>
      <text fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace" x="678" y="238">$change</text>

      <rect fill="#ece9f6" stroke="#7a6ad0" stroke-width="1.75" x="660" y="264" width="276" height="70" rx="10"/>
      <text fill="#20242e" font-size="14.5" font-weight="600" x="678" y="290">Carry for period t</text>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="678" y="312">wave_carry(out)</text>

      <path stroke="#7a6ad0" stroke-width="2" fill="none" d="M798,334 L798,398 L140,398 L140,260" marker-end="url(#a2)"/>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="470" y="390" text-anchor="middle">saveRDS(), and the next period takes it as an input</text>

      <text fill="#4a4660" font-size="12" x="24" y="432">The weight the office publishes is <tspan fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace">$weights</tspan>, identical to <tspan fill="#20242e" font-size="13" font-family="'JetBrains Mono',ui-monospace,monospace">prep(spec)$final_weight</tspan>.</text>

</svg>
