<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 960 340" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,'Inter',Segoe UI,Roboto,sans-serif;">
<title>What the thin carry and the fat carry hold</title>
<desc>The thin carry holds the PSU multiplicities, the stratum of each PSU, the number of PSUs per stratum, the replicate values and the point estimate of every estimand, and a fingerprint of the period data. It weighs four kilobytes and holds no person level data. The fat carry, required by a composite recipe, adds the replicate weight matrix, the period microdata and the point weights, and weighs about one hundred and sixty kilobytes.</desc>
<defs></defs>

      <text fill="#8a84a8" font-size="10.5" letter-spacing="1.2" font-family="'JetBrains Mono',ui-monospace,monospace" x="24" y="24">THIN CARRY, NO COMPOSITE STEP</text>
      <rect fill="#ece9f6" stroke="#7a6ad0" stroke-width="1.75" x="24" y="40" width="430" height="252" rx="12"/>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="44" y="68">$mult</text>
      <text fill="#4a4660" font-size="12" x="150" y="68">PSU &#215; R integers</text>
      <text fill="#4a4660" font-size="12" x="150" y="86">the multiplicities that coordinate the next period</text>
      <line stroke="#d9dce6" stroke-width="1.6" fill="none" x1="44" y1="102" x2="434" y2="102"/>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="44" y="126">$psu_stratum</text>
      <text fill="#4a4660" font-size="12" x="150" y="126">the stratum each PSU belongs to</text>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="44" y="148">$nh</text>
      <text fill="#4a4660" font-size="12" x="150" y="148">number of PSUs per stratum</text>
      <line stroke="#d9dce6" stroke-width="1.6" fill="none" x1="44" y1="164" x2="434" y2="164"/>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="44" y="188">$theta</text>
      <text fill="#4a4660" font-size="12" x="150" y="188">the R replicate values of every estimand</text>
      <text fill="#4a4660" font-size="12" x="150" y="206">this is where the covariance between periods comes from</text>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="44" y="228">$point</text>
      <text fill="#4a4660" font-size="12" x="150" y="228">the point estimate of every estimand</text>
      <line stroke="#d9dce6" stroke-width="1.6" fill="none" x1="44" y1="244" x2="434" y2="244"/>
      <text fill="#534ab7" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="44" y="268">$data_fp</text>
      <text fill="#4a4660" font-size="12" x="150" y="268">a fingerprint of the microdata, to identify the period</text>
      <text fill="#4a4660" font-size="12" x="24" y="316">4 KB. No person-level data.</text>

      <text fill="#8a84a8" font-size="10.5" letter-spacing="1.2" font-family="'JetBrains Mono',ui-monospace,monospace" x="506" y="24">FAT CARRY, WITH step_cre()</text>
      <rect fill="#fdf6e8" stroke="#c9902a" stroke-width="1.75" x="506" y="40" width="430" height="252" rx="12"/>
      <text fill="#4a4660" font-size="12" x="526" y="68">everything in the thin carry, and</text>
      <line stroke="#d9dce6" stroke-width="1.6" fill="none" x1="526" y1="84" x2="916" y2="84"/>
      <text fill="#8a6414" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="526" y="112">$reps</text>
      <text fill="#4a4660" font-size="12" x="632" y="112">units &#215; R</text>
      <text fill="#4a4660" font-size="12" x="632" y="130">the replicate weights of the period;</text>
      <text fill="#4a4660" font-size="12" x="632" y="148">this is what rebuilds Zhat replicate by replicate</text>
      <line stroke="#d9dce6" stroke-width="1.6" fill="none" x1="526" y1="164" x2="916" y2="164"/>
      <text fill="#8a6414" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="526" y="188">$data</text>
      <text fill="#4a4660" font-size="12" x="632" y="188">the period microdata, needed to build</text>
      <text fill="#4a4660" font-size="12" x="632" y="206">the composite Z blocks</text>
      <text fill="#8a6414" font-size="12.5" font-weight="500" font-family="'JetBrains Mono',ui-monospace,monospace" x="526" y="228">$weights</text>
      <text fill="#4a4660" font-size="12" x="632" y="228">the point weights of the period</text>
      <line stroke="#d9dce6" stroke-width="1.6" fill="none" x1="526" y1="244" x2="916" y2="244"/>
      <text fill="#4a4660" font-size="12" x="526" y="268">it is picked automatically: carry = "auto" detects it</text>
      <text fill="#4a4660" font-size="12" x="506" y="316">160 KB. It holds microdata: treat it as such.</text>

</svg>
