<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,'Inter',Segoe UI,Roboto,sans-serif;">
<title>The volunteer file and the probability reference</title>
<desc>The volunteer file records the auxiliaries x and the study variables y but has no weight column. The probability reference records the same auxiliaries x and carries design weights d, but not the study variables. The construction fills the missing weight column on the volunteer file with a single column used for every study variable.</desc>
<defs><marker id="np1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7a6ad0" stroke-width="1.8"/></marker></defs>

<text x="150" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#3d3580">volunteer file</text>
<rect x="40" y="38" width="220" height="104" rx="8" fill="#f4f2fb" stroke="#7a6ad0" stroke-width="1.3"/>
<rect x="40" y="38" width="220" height="26" rx="8" fill="#ece9f6" stroke="#7a6ad0" stroke-width="1.3"/>
<text x="76" y="56" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#3d3580">x</text>
<text x="150" y="56" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#3d3580">y1 … yK</text>
<text x="228" y="56" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#8a84a8">w</text>
<line x1="113" y1="38" x2="113" y2="142" stroke="#c6bef4" stroke-width="1"/>
<line x1="196" y1="38" x2="196" y2="142" stroke="#c6bef4" stroke-width="1"/>
<rect x="196" y="64" width="64" height="78" fill="#fdf6e8" stroke="#c9902a" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="228" y="108" text-anchor="middle" font-size="22" fill="#c9902a">?</text>
<text x="76" y="86" text-anchor="middle" font-size="11" fill="#6b6a86">age sex</text>
<text x="76" y="104" text-anchor="middle" font-size="11" fill="#6b6a86">region</text>
<text x="150" y="86" text-anchor="middle" font-size="11" fill="#6b6a86">income</text>
<text x="150" y="104" text-anchor="middle" font-size="11" fill="#6b6a86">employed</text>
<text x="150" y="122" text-anchor="middle" font-size="11" fill="#6b6a86">…</text>

<text x="530" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#3d3580">probability reference</text>
