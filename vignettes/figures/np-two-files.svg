<rect x="420" y="38" width="220" height="26" rx="8" fill="#ece9f6" stroke="#7a6ad0" stroke-width="1.3"/>
<text x="456" y="56" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#3d3580">x</text>
<text x="530" y="56" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#8a84a8">y1 … yK</text>
<text x="608" y="56" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#3d3580">d</text>
<line x1="493" y1="38" x2="493" y2="142" stroke="#c6bef4" stroke-width="1"/>
